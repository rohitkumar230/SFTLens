[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sftlens"
version = "0.1.0"
description = "Layer-geometry telemetry for supervised fine-tuning runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# transformers/datasets/accelerate are pinned exactly: the telemetry attaches to
# Trainer's callback and module-hook APIs, both of which have moved between
# minor releases, and an unpinned environment is the most likely cause of a
# silently mis-measured run.
#
# torch is deliberately a RANGE. On a cloud image torch is preinstalled and
# matched to the host CUDA driver; pinning an exact version forces a 2.5 GB
# reinstall that can leave you with a torch built for the wrong CUDA. Install
# with --no-deps on such images and keep the provided torch.
dependencies = [
    "torch>=2.4,<3",
    "transformers==4.51.3",
    "datasets==3.5.0",
    "accelerate==1.6.0",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sftlens-train = "sftlens.train.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires model download or GPU"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
